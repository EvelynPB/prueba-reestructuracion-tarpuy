<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultados del concurso</title>
  <link rel="icon" type="image/png" href="/logo-icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Exo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<main class="pagina">
  <header class="cabecera">
    <img class="logo" src="/logo.png" alt="Logo Tarpuy" width="250" height="270">
    <div class="titulo">
      <h1>Resultados del concurso</h1>
    </div>
  </header>

  <div id="estado" class="aviso">Cargando resultados…</div>

  <div id="app" hidden>
    <div class="tabs" role="tablist" aria-label="Tipo de ranking">
      <button type="button" role="tab" id="tabGrado" aria-selected="true">Ranking por grado</button>
      <button type="button" role="tab" id="tabGeneral" aria-selected="false">Ranking general</button>
      <button type="button" role="tab" id="tabColegios" aria-selected="false">Ranking de delegaciones</button>
    </div>

    <div class="filtros">
      <div class="solo-alumnos">
        <label for="buscar">Buscar alumno</label>
        <input id="buscar" list="nombres" placeholder="Escribe un nombre o apellido" autocomplete="off">
        <datalist id="nombres"></datalist>
      </div>
      <div><label for="colegio">Colegio</label><select id="colegio"></select></div>
      <div class="solo-alumnos"><label for="nivel">Nivel</label><select id="nivel"></select></div>
      <div class="solo-alumnos"><label for="grado">Grado</label><select id="grado"></select></div>
      <div class="solo-alumnos"><label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
          <option value="DELEGACION">Delegación</option>
          <option value="LIBRE">Alumno libre</option>
        </select>
      </div>
    </div>

    <div class="barra">
      <span id="conteo"></span>
      <span>
        <span id="info"></span>
        <button id="btnAct" type="button">Actualizar</button>
        <button id="btnLimpiar" type="button" hidden>Limpiar filtros</button>
      </span>
    </div>

    <nav id="chips" class="chips" aria-label="Ir a un grado"></nav>
    <div id="vacio" class="vacio" hidden>No hay alumnos con esos filtros.</div>
    <div id="grupos"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const natural = (a, b) => String(a).localeCompare(String(b), 'es', { numeric: true });
const uniq = a => [...new Set(a)].sort(natural);
const nivelOrden = n => { const x = norm(n); return x.includes('inicial') ? 0 : x.includes('primaria') ? 1 : x.includes('secundaria') ? 2 : 3; };
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const NO = '<span class="no-rindio">No rindió</span>';

const nivelCat = n => { const x = norm(n); return x.includes('inicial') ? 'Inicial' : x.includes('primaria') ? 'Primaria' : x.includes('secundaria') ? 'Secundaria' : n; };

// Puesto general dentro de cada nivel (Inicial, Primaria, Secundaria): % del máximo alto primero y,
// si empatan, la hora de entrega más temprana. Quien no rindió no tiene puesto.
function calcularPuestosNivel() {
  const porNivel = new Map();
  datos.forEach(d => {
    d.puesto_nivel = null;
    if (!d.rindio) return;
    const k = nivelCat(d.nivel);
    if (!porNivel.has(k)) porNivel.set(k, []);
    porNivel.get(k).push(d);
  });
  porNivel.forEach(lista => {
    lista.sort((a, b) => (b.porcentaje - a.porcentaje) || natural(a.hora_entrega, b.hora_entrega));
    lista.forEach((d, i) => {
      const ant = lista[i - 1];
      d.puesto_nivel = ant && ant.porcentaje === d.porcentaje && ant.hora_entrega === d.hora_entrega ? ant.puesto_nivel : i + 1;
    });
  });
}

let datos = [], actualizado = null, vista = 'grado';
let colegiosDatos = [], colegiosOk = false;
const ordenInicial = () => ({ clave: vista === 'general' ? 'puesto_nivel' : vista === 'colegios' ? 'puesto' : 'merito', dir: 1 });
let orden = ordenInicial();
const f = { colegio: '', nivel: '', grado: '', tipo: '' };

function llenar(id, valores) {
  const s = $(id);
  s.innerHTML = '<option value="">Todos</option>' + valores.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  if (valores.includes(f[id])) s.value = f[id]; else { f[id] = ''; s.value = ''; }
}

const cabecera = cols => cols.map(([k, t, num]) =>
  `<th class="${num ? 'num' : ''}" data-k="${k}">${t}${orden.clave === k ? (orden.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');

// Los alumnos que no rindieron van siempre al final de la tabla
function ordenar(filas) {
  const { clave, dir } = orden;
  const si = filas.filter(d => d.rindio !== false);
  const no = filas.filter(d => d.rindio === false);
  si.sort((a, b) => {
    let x = a[clave], y = b[clave];
    if (x == null) x = 0;
    if (y == null) y = 0;
    const c = typeof x === 'number' ? x - y : natural(x, y);
    if (c) return c * dir;
    return (b.puntaje - a.puntaje) || natural(a.hora_entrega || '', b.hora_entrega || '') || natural(a.colegio || '', b.colegio || '');
  });
  no.sort((a, b) => natural(a.nombre, b.nombre));
  filas.length = 0;
  filas.push(...si, ...no);
  return filas;
}

const COLS_GRADO = [['merito', 'Mérito', true], ['nombre', 'Alumno', false], ['colegio', 'Colegio', false],
  ['puntaje', 'Puntaje', true], ['hora_entrega', 'Hora de entrega', true]];
const COLS_GENERAL = [['puesto_nivel', 'Puesto', true], ['nombre', 'Alumno', false], ['colegio', 'Colegio', false],
  ['grado', 'Grado', false], ['puntaje', 'Puntaje', true], ['porcentaje', '% del máximo', true],
  ['hora_entrega', 'Hora de entrega', true], ['merito', 'Mérito en grado', true]];
const COLS_COLEGIOS = [['puesto', 'Puesto', true], ['colegio', 'Colegio', false], ['inicial', 'Inicial', true],
  ['primaria', 'Primaria', true], ['secundaria', 'Secundaria', true], ['acumulado', 'Acumulado', true],
  ['promedio', 'Promedio (÷ 3)', true], ['rindieron', 'Rindieron / inscritos', true]];

const claseFila = (d, puesto) => (d.rindio && puesto <= 3 ? 'p' + puesto : '') + (d.rindio ? '' : ' nr');
const horaTxt = d => (d.rindio ? esc(d.hora_entrega) : '—');
const ptsTxt = d => d.puntaje.toFixed(2) + (d.rindio ? '' : ' ' + NO);
const celNivel = (pct, pts) => (pct == null ? '—' : `<strong>${pct.toFixed(1)}%</strong> <small>${pts.toFixed(1)} pts</small>`);

function pintarColegios() {
  llenar('colegio', colegiosDatos.map(c => c.colegio).sort(natural));
  $('chips').innerHTML = '';
  $('btnLimpiar').hidden = !f.colegio;
  $('nombres').innerHTML = '';
  if (!colegiosOk) {
    $('grupos').innerHTML = '';
    $('vacio').hidden = false;
    $('vacio').textContent = 'El ranking de delegaciones aún no está disponible.';
    $('conteo').textContent = '';
    return;
  }
  $('vacio').textContent = 'No hay colegios con esos filtros.';
  const lista = colegiosDatos.filter(c => !f.colegio || c.colegio === f.colegio);
  ordenar(lista);
  const filas = lista.map(c => `<tr class="${c.puesto <= 3 ? 'p' + c.puesto : ''}">
    <td class="num">${c.puesto}</td><td>${esc(c.colegio)}</td>
    <td class="num">${celNivel(c.inicial, c.inicial_pts)}</td><td class="num">${celNivel(c.primaria, c.primaria_pts)}</td>
    <td class="num">${celNivel(c.secundaria, c.secundaria_pts)}</td>
    <td class="num">${c.acumulado.toFixed(2)}</td><td class="num"><strong>${c.promedio.toFixed(2)}%</strong></td>
    <td class="num">${c.rindieron} / ${c.inscritos}</td></tr>`).join('');
  $('grupos').innerHTML = lista.length
    ? `<section class="grupo"><h2>Ranking de delegaciones <small>${plural(lista.length, 'colegio', 'colegios')}</small></h2>
       <p class="nota">Cada nivel se mide como el porcentaje del puntaje máximo (Inicial 200; Primaria y Secundaria 150) que logra, en promedio, el colegio entre todos sus alumnos inscritos en ese nivel; quien no rindió cuenta con 0 puntos. El acumulado suma los tres niveles y el promedio es el acumulado ÷ 3; un nivel sin resultados cuenta como 0 (—). No incluye alumnos libres.</p>
       <div class="tabla-wrap"><table><thead><tr>${cabecera(COLS_COLEGIOS)}</tr></thead><tbody>${filas}</tbody></table></div></section>` : '';
  $('vacio').hidden = lista.length > 0;
  $('conteo').textContent = `${lista.length} de ${colegiosDatos.length} colegios`;
}

function pintar() {
  if (vista === 'colegios') return pintarColegios();
  llenar('colegio', uniq(datos.map(d => d.colegio)));
  llenar('nivel', [...new Set(datos.map(d => d.nivel))].sort((a, b) => nivelOrden(a) - nivelOrden(b) || natural(a, b)));
  llenar('grado', uniq(datos.filter(d => !f.nivel || d.nivel === f.nivel).map(d => d.grado)));

  const nq = norm($('buscar').value);
  const lista = datos.filter(d =>
    (!f.colegio || d.colegio === f.colegio) && (!f.nivel || d.nivel === f.nivel) &&
    (!f.grado || d.grado === f.grado) && (!f.tipo || d.tipo === f.tipo) &&
    (!nq || norm(d.nombre).includes(nq)));
  const noRindieron = lista.filter(d => !d.rindio).length;

  if (vista === 'general') {
    // Un ranking general por cada nivel, con todos sus grados juntos
    const mapaN = new Map();
    for (const d of lista) {
      const k = nivelCat(d.nivel);
      if (!mapaN.has(k)) mapaN.set(k, { nivel: k, filas: [] });
      mapaN.get(k).filas.push(d);
    }
    const niveles = [...mapaN.values()].sort((a, b) => nivelOrden(a.nivel) - nivelOrden(b.nivel) || natural(a.nivel, b.nivel));
    const cab = cabecera(COLS_GENERAL);
    const nota = niveles.length
      ? `<p class="nota">El ranking general o Cómmputo General se ordena por el porcentaje del puntaje máximo de cada nivel. Quien no rindió figura con 0 puntos y sin puesto, al final. En caso de empate, gana la hora de entrega más temprana. Está separado por nivel: Inicial, Primaria y Secundaria.</p>` : '';
    $('grupos').innerHTML = nota + niveles.map((g, i) => {
      ordenar(g.filas);
      const no = g.filas.filter(d => !d.rindio).length;
      const filas = g.filas.map(d => `<tr class="${claseFila(d, d.puesto_nivel)}">
        <td class="num">${d.rindio ? d.puesto_nivel : '—'}</td><td>${esc(d.nombre)}</td><td>${esc(d.colegio)}</td>
        <td>${esc(d.grado)}</td><td class="num">${ptsTxt(d)} <small class="max">/ ${d.maximo}</small></td>
        <td class="num">${d.porcentaje.toFixed(1)}%</td><td class="num">${horaTxt(d)}</td>
        <td class="num">${d.rindio ? d.merito : '—'}</td></tr>`).join('');
      return `<section class="grupo" id="g${i}">
        <h2>Ranking general · ${esc(g.nivel)} <small>${plural(g.filas.length, 'alumno', 'alumnos')}${no ? ` · ${no} no rindieron` : ''}</small></h2>
        <div class="tabla-wrap"><table><thead><tr>${cab}</tr></thead><tbody>${filas}</tbody></table></div>
      </section>`;
    }).join('');
    $('chips').innerHTML = niveles.length > 1
      ? niveles.map((g, i) => `<a href="#g${i}">${esc(g.nivel)}</a>`).join('') : '';
  } else {
    const mapa = new Map();
    for (const d of lista) {
      const k = d.nivel + '|' + d.grado;
      if (!mapa.has(k)) mapa.set(k, { nivel: d.nivel, grado: d.grado, filas: [] });
      mapa.get(k).filas.push(d);
    }
    const grupos = [...mapa.values()].sort((a, b) =>
      nivelOrden(a.nivel) - nivelOrden(b.nivel) || natural(a.nivel, b.nivel) || natural(a.grado, b.grado));
    const cab = cabecera(COLS_GRADO);
    $('grupos').innerHTML = grupos.map((g, i) => {
      ordenar(g.filas);
      const no = g.filas.filter(d => !d.rindio).length;
      const filas = g.filas.map(d => `<tr class="${claseFila(d, d.merito)}">
        <td class="num">${d.rindio ? d.merito : '—'}</td><td>${esc(d.nombre)}</td><td>${esc(d.colegio)}</td>
        <td class="num">${ptsTxt(d)}</td><td class="num">${horaTxt(d)}</td></tr>`).join('');
      return `<section class="grupo" id="g${i}">
        <h2>${esc(g.nivel)} · ${esc(g.grado)} <small>${plural(g.filas.length, 'alumno', 'alumnos')}${no ? ` · ${no} no rindieron` : ''}</small></h2>
        <div class="tabla-wrap"><table><thead><tr>${cab}</tr></thead><tbody>${filas}</tbody></table></div>
      </section>`;
    }).join('');
    $('chips').innerHTML = grupos.length > 1
      ? grupos.map((g, i) => `<a href="#g${i}">${esc(g.nivel)} · ${esc(g.grado)}</a>`).join('') : '';
  }

  $('vacio').hidden = lista.length > 0;
  $('conteo').textContent = `${lista.length} de ${datos.length} alumnos` + (noRindieron ? ` · ${noRindieron} no rindieron` : '');
  $('btnLimpiar').hidden = !(nq || Object.values(f).some(Boolean));

  const sug = nq.length >= 2 ? datos.filter(d => norm(d.nombre).includes(nq)).slice(0, 8) : [];
  $('nombres').innerHTML = sug.map(s => `<option value="${esc(s.nombre)}">`).join('');
}

function animar() {                                      // las filas entran con animación al abrir o cambiar de pestaña
  const c = $('grupos').classList;
  if (!c || !c.add) return;
  c.remove('entrando'); void $('grupos').offsetWidth; c.add('entrando');
  clearTimeout(animar.t); animar.t = setTimeout(() => c.remove('entrando'), 1700);
}
let yaAnimado = false;

function cambiarVista(v) {
  if (v === 'colegios' || vista === 'colegios') {          // los filtros de alumno no aplican a delegaciones
    Object.keys(f).forEach(k => f[k] = ''); $('tipo').value = ''; $('buscar').value = '';
  }
  vista = v; orden = ordenInicial();
  $('tabGrado').setAttribute('aria-selected', v === 'grado');
  $('tabGeneral').setAttribute('aria-selected', v === 'general');
  $('tabColegios').setAttribute('aria-selected', v === 'colegios');
  document.querySelectorAll('.solo-alumnos').forEach(el => { el.hidden = v === 'colegios'; });
  pintar();
  animar();
}

async function cargar() {
  try {
    const r = await fetch('/api/resultados', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    datos = j.datos; actualizado = Date.now();
    calcularPuestosNivel();
    try {
      const r2 = await fetch('/api/ranking-colegios', { cache: 'no-store' });
      const j2 = await r2.json();
      colegiosOk = r2.ok;
      if (r2.ok) colegiosDatos = j2.datos;
    } catch { colegiosOk = false; }
    $('info').className = '';
    if (!j.publicado) {
      $('app').hidden = true; $('estado').hidden = false;
      $('estado').textContent = 'Los resultados aún no se han publicado. Vuelve más tarde.';
    } else {
      $('estado').hidden = true; $('app').hidden = false; pintar();
      if (!yaAnimado) { yaAnimado = true; animar(); }
    }
  } catch {
    if (!actualizado) $('estado').textContent = 'No se pudieron cargar los resultados. Se reintentará automáticamente.';
    $('info').className = 'error';
    $('info').textContent = 'No se pudo actualizar. ';
  }
}

['colegio', 'nivel', 'grado', 'tipo'].forEach(id =>
  $(id).addEventListener('change', e => { f[id] = e.target.value; if (id === 'nivel') f.grado = ''; pintar(); }));
$('buscar').addEventListener('input', pintar);
$('btnAct').addEventListener('click', cargar);
$('btnLimpiar').addEventListener('click', () => {
  Object.keys(f).forEach(k => f[k] = ''); $('tipo').value = ''; $('buscar').value = '';
  orden = ordenInicial(); pintar();
});
$('tabGrado').addEventListener('click', () => cambiarVista('grado'));
$('tabGeneral').addEventListener('click', () => cambiarVista('general'));
$('tabColegios').addEventListener('click', () => cambiarVista('colegios'));
$('grupos').addEventListener('click', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  orden = { clave: k, dir: orden.clave === k ? -orden.dir : 1 }; pintar();
});

setInterval(() => {
  if (actualizado && !$('info').classList.contains('error'))
    $('info').textContent = `Actualizado hace ${Math.round((Date.now() - actualizado) / 1000)} s `;
}, 1000);
setInterval(cargar, 20000);
cargar();
</script>
<script src="/fondo.js"></script>
</body>
</html>
